project: hr-workflow

environments:
  local:
    non_secret:
      NODE_ENV: development
      BACKEND_PORT: "4001"
      BACKEND_PUBLIC_URL: http://localhost:4001
      VITE_GRAPHQL_ENDPOINT: http://localhost:4001/graphql
      EXPO_PUBLIC_GRAPHQL_ENDPOINT: http://localhost:4001/graphql
      ALLOWED_ORIGINS: http://localhost:5173
      JWT_EXPIRY: 7d
      POLICY_STORAGE_DIR: ./.data/policies
    secrets:
      - DATABASE_URL
      - JWT_SECRET

  test:
    non_secret:
      NODE_ENV: test
      BACKEND_PORT: "4001"
      BACKEND_PUBLIC_URL: http://localhost:4001
      VITE_GRAPHQL_ENDPOINT: http://localhost:4001/graphql
      EXPO_PUBLIC_GRAPHQL_ENDPOINT: http://localhost:4001/graphql
      ALLOWED_ORIGINS: http://localhost:5173
      JWT_EXPIRY: 7d
      POLICY_STORAGE_DIR: ./.data/test-policies
    secrets:
      - DATABASE_URL
      - JWT_SECRET

  remote:
    non_secret:
      NODE_ENV: development
      BACKEND_PORT: "4001"
      BACKEND_PUBLIC_URL: http://localhost:4001
      VITE_GRAPHQL_ENDPOINT: http://localhost:4001/graphql
      EXPO_PUBLIC_GRAPHQL_ENDPOINT: http://localhost:4001/graphql
      ALLOWED_ORIGINS: http://localhost:5173
      JWT_EXPIRY: 7d
      POLICY_STORAGE_DIR: ./.data/remote-development-policies
    secrets:
      - DATABASE_URL
      - JWT_SECRET

  production:
    non_secret:
      NODE_ENV: production
      BACKEND_PORT: "4001"
      BACKEND_PUBLIC_URL: https://api.hrflow.lab.novadev.tech
      VITE_GRAPHQL_ENDPOINT: https://api.hrflow.lab.novadev.tech/graphql
      EXPO_PUBLIC_GRAPHQL_ENDPOINT: https://api.hrflow.lab.novadev.tech/graphql
      ALLOWED_ORIGINS: https://admin.hrflow.lab.novadev.tech
      JWT_EXPIRY: 7d
      TRUST_PROXY: "1"
      # Inside the persistent /opt/app-data:/app/data runtime mount.
      POLICY_STORAGE_DIR: /app/data/hr-workflow/policies
    secrets:
      - DATABASE_URL
      - JWT_SECRET
      - HR_WORKFLOW_ADMIN_EMAIL
      - HR_WORKFLOW_ADMIN_PASSWORD
