project: rakss

environments:
  local:
    non_secret:
      NODE_ENV: development
      BACKEND_PORT: "4001"
      BACKEND_PUBLIC_URL: http://localhost:4001
      VITE_GRAPHQL_ENDPOINT: http://localhost:4001/graphql
      EXPO_PUBLIC_GRAPHQL_ENDPOINT: http://localhost:4001/graphql
      ALLOWED_ORIGINS: http://localhost:5173
      JWT_EXPIRY: 7d
      POLICY_STORAGE_DIR: ./.data/policies
    secrets:
      - DATABASE_URL
      - JWT_SECRET

  production:
    non_secret:
      NODE_ENV: production
      BACKEND_PORT: "4001"
      BACKEND_PUBLIC_URL: https://api.rakss.lab.novadev.tech
      VITE_GRAPHQL_ENDPOINT: https://api.rakss.lab.novadev.tech/graphql
      EXPO_PUBLIC_GRAPHQL_ENDPOINT: https://api.rakss.lab.novadev.tech/graphql
      ALLOWED_ORIGINS: https://admin.rakss.lab.novadev.tech
      JWT_EXPIRY: 7d
      POLICY_STORAGE_DIR: /var/lib/rakss/policies
    secrets:
      - DATABASE_URL
      - JWT_SECRET
