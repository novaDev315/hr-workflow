services:
  postgres:
    image: postgres:15-alpine
    container_name: hrflow-postgres-dev
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hrflow_dev}
      POSTGRES_USER: ${POSTGRES_USER:-hrflow_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hrflow_admin} -d ${POSTGRES_DB:-hrflow_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.dev
      target: development
    container_name: hrflow-backend-dev
    ports:
      - "${BACKEND_PORT:-4001}:4001"
    environment:
      NODE_ENV: development
      BACKEND_PORT: 4001
      DATABASE_URL: postgresql://${POSTGRES_USER:-hrflow_admin}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-hrflow_dev}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ random characters)}
      JWT_EXPIRY: ${JWT_EXPIRY:-3600s}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081,http://localhost:19006}
      TRUST_PROXY: ${TRUST_PROXY:-}
      BOOTSTRAP_ALLOWED: ${BOOTSTRAP_ALLOWED:-}
      HR_WORKFLOW_ADMIN_EMAIL: ${HR_WORKFLOW_ADMIN_EMAIL:-}
      HR_WORKFLOW_ADMIN_PASSWORD: ${HR_WORKFLOW_ADMIN_PASSWORD:-}
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
    command: bun run dev
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-dev-data:
