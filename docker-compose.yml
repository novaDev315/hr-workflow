services:
  postgres:
    image: postgres:15-alpine
    container_name: hrflow-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hrflow_dev}
      POSTGRES_USER: ${POSTGRES_USER:-hrflow_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hrflow_admin} -d ${POSTGRES_DB:-hrflow_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: hrflow-backend
    ports:
      - "${BACKEND_PORT:-4001}:4001"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      BACKEND_PORT: 4001
      DATABASE_URL: postgresql://${POSTGRES_USER:-hrflow_admin}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-hrflow_dev}
      JWT_SECRET: ${JWT_SECRET:-change_me_to_random_256_bit_secret}
      JWT_EXPIRY: ${JWT_EXPIRY:-3600s}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081,http://localhost:19006}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres-data:
