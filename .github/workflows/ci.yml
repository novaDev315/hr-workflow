name: CI Pipeline

on:
  push:
    branches: [main, develop, claude/**]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

  test-services:
    name: Test Microservices
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    strategy:
      matrix:
        service: [employee, attendance, location, leave, payroll]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma migrations
        working-directory: ./services/${{ matrix.service }}
        run: |
          npx prisma generate
          npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db?schema=${{ matrix.service }}

      - name: Run tests
        working-directory: ./services/${{ matrix.service }}
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db?schema=${{ matrix.service }}
          REDIS_URL: redis://localhost:6379

  test-api-gateway:
    name: Test API Gateway
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        working-directory: ./apps/api-gateway
        run: npm test

  build-services:
    name: Build Services
    runs-on: ubuntu-latest
    needs: [lint, test-services]

    strategy:
      matrix:
        service: [api-gateway, employee, attendance, location, leave, payroll]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build service
        run: npm run build --workspace=services/${{ matrix.service }}
        if: startsWith(matrix.service, 'api-gateway') == false

      - name: Build API Gateway
        run: npm run build --workspace=apps/api-gateway
        if: matrix.service == 'api-gateway'

  build-web-admin:
    name: Build Web Admin
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        working-directory: ./apps/web-admin
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-admin-build
          path: apps/web-admin/dist

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-services]

    strategy:
      matrix:
        service: [api-gateway, employee, attendance, location, leave, payroll]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build service image
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          push: false
          tags: hrflow/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        if: startsWith(matrix.service, 'api-gateway') == false

      - name: Build API Gateway image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api-gateway
          file: ./apps/api-gateway/Dockerfile
          push: false
          tags: hrflow/api-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        if: matrix.service == 'api-gateway'
