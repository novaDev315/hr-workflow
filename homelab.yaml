# homelab.yaml - Project deployment configuration
# Generated by homelab apps init
# Type: Monorepo (turborepo)

schema_version: 2
project: hr-workflow
version: v1.0
type: monorepo
# Default build settings (can be overridden per service)
build:
  context: .
# Default deployment settings
deploy:
  target: web
  # v2 never infers the host; this is the shared web runtime (10.0.60.10).
  host: 10.0.60.10
  # Public domain hrflow.*; the project id is hr-workflow.
  base_domain: hrflow
  port: 5173
  # Keep the v1 runtime: Traefik reaches the containers from another host, and
  # policy uploads persist under /app/data (POLICY_STORAGE_DIR).
  runtime:
    bind: 0.0.0.0
    volumes:
      - host_path: /opt/app-data
        container_path: /app/data
    security:
      apparmor: unconfined
      no_new_privileges: false
# Tests run outside ship (local/CI suites against a migrated Postgres); the
# runtime image is production-only and has no test tooling.
test:
  mode: external
# Git configuration
git:
  remote: gitea
  branch: main
# Services - each service can be deployed independently
services:
  backend:
    dockerfile: apps/backend/Dockerfile
    context: .
    service_type: api
    domain: api
    health_endpoint: /health
    port: 4001
    dependencies:
      database:
        type: postgres
        provision: central
        name: hr_workflow_backend_production
    database:
      migration:
        command: bun run migrate:deploy
        timeout: 300
  web-admin:
    dockerfile: apps/web-admin/Dockerfile
    context: .
    service_type: frontend
    domain: admin
    health_endpoint: /health
    port: 8080
