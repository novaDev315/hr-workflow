# homelab.yaml - Project deployment configuration
# Generated by homelab apps init
# Type: Monorepo (turborepo)

project: rakss
version: v1.0
type: monorepo

workspace:
  monorepo: turborepo
  package_manager: bun

# Default build settings (can be overridden per service)
build:
  context: .
  cache: true

# Default deployment settings
deploy:
  target: web
  base_domain: rakss

database:
  migration:
    enabled: false
    timeout_seconds: 300

# Git configuration
git:
  remote: gitea
  branch: main

# Services - each service can be deployed independently
services:
  backend:
    dockerfile: apps/backend/Dockerfile
    context: apps/backend
    service_type: api
    domain: api
    health_endpoint: /health
    port: 4001
    deploy:
      env_file: .env.production
    dependencies:
      database:
        type: postgres
        provision: central
        name: rakss_backend_production
    database:
      migration:
        enabled: true
        command: bun run migrate:deploy
        required_for_ship: true
        env_file: .env.production
  web-admin:
    dockerfile: apps/web-admin/Dockerfile
    context: apps/web-admin
    service_type: frontend
    domain: admin
    health_endpoint: /health
    port: 8080
