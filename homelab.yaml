# homelab.yaml - Project deployment configuration
# Generated by homelab apps init
# Type: Monorepo (turborepo)

project: rakss
version: v1.0
type: monorepo
workspace:
  monorepo: turborepo
  package_manager: bun
# Default build settings (can be overridden per service)
build:
  context: .
  cache: true
# Default deployment settings
deploy:
  target: web
  # Public domain hrflow.*; internal project id and database stay 'rakss'.
  base_domain: hrflow
  port: 5173
database:
  migration:
    enabled: false
    timeout_seconds: 300
# Tests run outside ship (local/CI suites against a migrated Postgres); the
# runtime image is production-only and has no test tooling.
test:
  mode: external
# Git configuration
git:
  remote: gitea
  branch: main
# Services - each service can be deployed independently
services:
  backend:
    dockerfile: apps/backend/Dockerfile
    context: .
    service_type: api
    domain: api
    health_endpoint: /health
    port: 4001
    dependencies:
      database:
        type: postgres
        provision: central
        name: rakss_backend_production
    database:
      migration:
        enabled: true
        command: bun run migrate:deploy
        required_for_ship: true
  web-admin:
    dockerfile: apps/web-admin/Dockerfile
    context: .
    service_type: frontend
    domain: admin
    health_endpoint: /health
    port: 8080
