global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:4000']
    metrics_path: '/metrics'

  - job_name: 'employee-service'
    static_configs:
      - targets: ['employee-service:3001']
    metrics_path: '/metrics'

  - job_name: 'attendance-service'
    static_configs:
      - targets: ['attendance-service:3002']
    metrics_path: '/metrics'

  - job_name: 'leave-service'
    static_configs:
      - targets: ['leave-service:3003']
    metrics_path: '/metrics'

  - job_name: 'location-service'
    static_configs:
      - targets: ['location-service:3004']
    metrics_path: '/metrics'

  - job_name: 'payroll-service'
    static_configs:
      - targets: ['payroll-service:3005']
    metrics_path: '/metrics'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
